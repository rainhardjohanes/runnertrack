    <div id="modal-kit" class="fixed inset-0 z-50 bg-slate-900/50 hidden flex-col justify-end backdrop-blur-sm">
        <div class="bg-white w-full max-w-md mx-auto rounded-t-[2.5rem] h-[75vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center"><h3 class="font-black text-slate-800 uppercase text-xs tracking-widest">Select Kit ID</h3><button onclick="toggleModal('modal-kit')"><i class="fa-solid fa-xmark text-xl text-slate-300"></i></button></div>
            <div class="p-5 bg-slate-50"><input type="text" id="search-kit" class="w-full p-4 border rounded-2xl outline-none uppercase font-bold" placeholder="Type Kit ID to Search..." onkeyup="renderKitList()"></div>

        </div>
    </div>

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 px-8 py-5 rounded-full shadow-2xl opacity-0 transition-all pointer-events-none z-50 font-black text-xs uppercase tracking-widest">Success!</div>

    <script>
const { createClient } = window.supabase;

const db = createClient(
    'https://ezmevzvxqbsvwxufapck.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV6bWV2enZ4cWJzdnd4dWZhcGNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxNzEyNzUsImV4cCI6MjA5OTc0NzI3NX0.mrbmvvU4sKQT3aFLGbtrrqbzKcRPSEViXRmEyfGSGPE'
);        
        let currentUser = null;
        let globalTransactions = [], globalKitMap = new Map();
        let masterAreas = [], masterRunners = [], masterBusinesses = [], masterKitsData = [], masterKitTypes = [], masterSdrs = [];
        let selectedKits = []; 
        
        /** AUTHENTICATION (SECURED) **/
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.toLowerCase().trim();
            const pin = document.getElementById('login-pin').value;
            const errorText = document.getElementById('login-error');

            try {
                const { data: authData, error: authError } = await db.auth.signInWithPassword({ email: email, password: pin });
                await db.auth.getSession();
                if (authError) throw new Error("Invalid Email or PIN.");

                const { data: userData, error: userError } = await db.from('master_users').select('*').ilike('email', email).single();
                if (userError || !userData) {
                    await db.auth.signOut();
                    throw new Error("Your account is not registered in the system.");
                }

                const userRole = userData.role.toLowerCase();
                if (userRole !== 'staff' && userRole !== 'admin') {
                    await db.auth.signOut();
                    throw new Error("Access Denied: Invalid credentials.");
                }

                errorText.classList.add('hidden');
                localStorage.setItem('runner_user', JSON.stringify(userData));

                if (typeof initApp === 'function') initApp();
                else window.location.reload();

            } catch (err) {
                errorText.innerText = err.message;
                errorText.classList.remove('hidden');
            }
        });

        async function logout() { 
            await db.auth.signOut(); 
            localStorage.removeItem('runner_user'); 
            window.location.reload(); 
        }

        async function initApp() {
            const { data: { session } } = await db.auth.getSession();
            currentUser = JSON.parse(localStorage.getItem('runner_user'));
            
            if(!session || !currentUser) { 
                document.getElementById('login-screen').classList.remove('hidden-view'); 
                document.getElementById('app-container').classList.add('hidden-view'); 
                return; 
            }
            document.getElementById('login-screen').classList.add('hidden-view'); 
            document.getElementById('app-container').classList.remove('hidden-view');
            document.getElementById('header-role').innerText = currentUser.role.toUpperCase();
            
            fetchMasterData(); fetchData(); updateSyncUI();
        }

        /** DATA LOADERS **/
        async function fetchMasterData() {
            try {
                masterAreas = (await db.from('master_areas').select('*').order('area_name')).data || [];
                masterRunners = (await db.from('master_runners').select('*').order('runner_name')).data || [];
                masterBusinesses = (await db.from('master_businesses').select('*').order('business_name')).data || [];
                let allKits = [];
let fetchStart = 0;
while (true) {
    let { data } = await db.from('master_kits').select('*').order('kit_id').range(fetchStart, fetchStart + 999);
    if (!data || data.length === 0) break;
    allKits.push(...data);
    if (data.length <= 999) break;
    fetchStart += 1000;
}
masterKitsData = allKits;
                masterKitTypes = (await db.from('master_kit_types').select('*')).data || [];
                masterSdrs = (await db.from('master_sdrs').select('*').order('sdr_name')).data || [];

                if(currentUser.role.toLowerCase() === 'staff') {
                    const myRunner = masterRunners.find(r => r.runner_name === currentUser.runner_name);
                    const myArea = myRunner ? myRunner.area_name : '';
                    document.getElementById('input-area').innerHTML = `<option value="${myArea}">${myArea}</option>`;
                    document.getElementById('input-area').disabled = true;
                    document.getElementById('input-runner').innerHTML = `<option value="${currentUser.runner_name}">${currentUser.runner_name}</option>`;
                    document.getElementById('input-runner').disabled = true;
                    filterByArea(); 
                } else {
                    document.getElementById('input-area').innerHTML = `<option value="">-- Select Area --</option>` + masterAreas.map(a => `<option value="${a.area_name}">${a.area_name}</option>`).join('');
                }
            } catch(e) { console.error("Offline or Failed fetching master data.", e); }
        }

        function filterByArea() {
            const area = document.getElementById('input-area').value;
            if(currentUser.role.toLowerCase() === 'admin') {
                const runners = masterRunners.filter(r => r.area_name === area);
                document.getElementById('input-runner').innerHTML = `<option value="">-- Select Runner --</option>` + runners.map(r => `<option value="${r.runner_name}">${r.runner_name}</option>`).join('');
            }
            
            const filteredSdrs = masterSdrs.filter(s => s.area_name === area);
            document.getElementById('input-sdr-name').innerHTML = `<option value="">-- Select SDR --</option>` + filteredSdrs.map(s => `<option value="${s.sdr_name}">${s.sdr_name}</option>`).join('');
            
            document.getElementById('input-business').value = ""; document.getElementById('label-business').innerText = "Select Location...";
            resetKit(); 
        }   

        function renderBusinessList() {
            const area = document.getElementById('input-area').value;
            const search = document.getElementById('search-business').value.toLowerCase();
            const filtered = masterBusinesses.filter(b => (!area || b.area_name === area) && b.business_name.toLowerCase().includes(search));
            document.getElementById('list-business').innerHTML = filtered.map(b => `<li class="p-5 hover:bg-slate-50 cursor-pointer font-black text-slate-700" onclick="selectBusiness('${b.business_name}')">${b.business_name}</li>`).join('');
        }

        function getKitBadge(typeName) {
            const recipe = masterKitTypes.find(t => t.type_name === typeName);
            if (recipe && recipe.ui_icon && recipe.ui_color) {
                return { icon: `<i class="fa-solid ${recipe.ui_icon} mr-1"></i>`, colorClass: `bg-${recipe.ui_color}-50 text-${recipe.ui_color}-700 border-${recipe.ui_color}-200` };
            }

                if (!isAdmin) {

                        errLabel.innerText = `REJECTED: ${kitId} is already deployed at ${kitState.location}`; 
                        errLabel.classList.remove('hidden'); btnSubmit.disabled = true; return;

                                    ${opts}

                    } else if (phase === 'Phase 4') {

        async function compressImageToBase64(file) {
            return new Promise((res) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = e => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); let w = img.width, h = img.height; const max = 1024;
                        if(w>h && w>max){h*=max/w; w=max;} else if(h>max){w*=max/h; h=max;}
                        canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        res(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        const fName = `${Date.now()}_${Math.floor(Math.random()*1000)}.jpg`;

        const { error: upErr } = await db.storage
            .from('proofs')
            .upload(fName, blob);

        if (upErr) throw upErr;
        console.log("PHOTO OK");

        photoUrl = db.storage
            .from('proofs')
            .getPublicUrl(fName)
            .data.publicUrl;
    }

    const { error: dbErr } = await db
        .from('transactions')
        .insert([{
            sdr_name: p.sdr_name,
            area: p.area,
            phase: p.phase,
            runner_name: p.runner_name,
            business_name: p.business_name,
            kit_id: p.kit_id,
            kit_type: p.kit_type,
            sd_qty: p.sd_qty,
            sd_uploaded: p.sd_uploaded,
            gps_location: p.gps_location,
            device_condition: p.device_condition,
            missing_or_issue: p.missing_or_issue,
            proof_photo: photoUrl,
            created_at: p.created_at,
            other_item: p.other_item,
            pickup_time: p.pickup_time,
            drop_off_time: p.drop_off_time
        }]);

    if (dbErr) {
    console.log(dbErr);
    alert(dbErr.message);
    throw dbErr;
}
    console.log("TRANSACTION OK");


    // ===========================
    // UPDATE MASTER KIT
    // ===========================
    if (p.kit_id) {

        const targetLocation =
            p.phase === "Phase 4"
                ? "Warehouse"
                : p.business_name;

        const deployment =
            p.phase === "Phase 4"
                ? "Available"
                : "Deployed";

        const updateData = {
    last_location: targetLocation,
    business_name: deployment === "Deployed" ? targetLocation : null,
    status_deployment: deployment
};

        if (p.device_condition === "Damaged") {
            updateData.current_status = "Damaged";
        }

const { error: kitErr } = await db
    .from("master_kits")
    .update(updateData)
    .eq("kit_id", p.kit_id);

if (kitErr) throw kitErr;
console.log("MASTER KIT OK");
}
}

async function syncOfflineQueue() {
            if (!navigator.onLine) { alert("You are still offline. Please find a better signal."); return; }
            let queue = JSON.parse(localStorage.getItem('runner_sync_queue') || '[]');
            if (queue.length === 0) return;

            // --- FILTER SANITASI CACHE ---
            // Bersihkan data sampah dari cache lama HP sebelum dikirim ke database
            queue = queue.map(q => {
                if (q.phase === 'Phase 2' || q.phase === 'Phase 3') {
                    q.kit_id = null;
                    q.kit_type = null;
                    q.device_condition = null; // Phase 2 & 3 tidak butuh kondisi device
                }
                return q;
            });
            // -----------------------------

            const btn = document.getElementById('btn-sync-now');
            btn.innerHTML = `<div class="spinner mr-1"></div> Syncing...`; btn.disabled = true;

            let remainingQueue = [];
            for (let i = 0; i < queue.length; i++) {
                try { await processSinglePayload(queue[i]); } catch (e) { remainingQueue.push(queue[i]); }
            }

            localStorage.setItem('runner_sync_queue', JSON.stringify(remainingQueue));
            updateSyncUI(); fetchData();
            btn.innerHTML = `<i class="fa-solid fa-rotate mr-1"></i> Sync`; btn.disabled = false;
            
            if (remainingQueue.length === 0) showToast("All Offline Data Synced!");
            else showToast(`${remainingQueue.length} items failed to sync. Try again later.`, true);
        }

        window.addEventListener('online', syncOfflineQueue);

        document.getElementById('runnerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if(!document.getElementById('input-gps').value) { alert("GPS Required! Please click Refresh GPS."); return; }
            
            const phase = document.getElementById('input-phase').value;
            const business = document.getElementById('input-business').value;
            if (!business) { alert("Merchant Location is required!"); return; }

            let hasKits = selectedKits.length > 0;
            let condition = document.getElementById('input-condition').value || null;
            let match = document.getElementById('input-match').value || null;
            let sdQtyRaw = document.getElementById('input-sd').value;
            
            let photoCount = 1;
            let sdrNameVal = document.getElementById('input-sdr-name').value || null;


            if (phase === 'Phase 1') {
                if (!sdrNameVal) { alert("SDR Name is required for Phase 1!"); return; } 
                if (!hasKits) { alert("At least one Kit ID is required!"); return; }
                if (!condition) { alert("Physical Integrity (Good/Damaged) is required!"); return; }
                if (!match) { alert("Audit Checklist Match (Yes/No) is required!"); return; }
            } else if (phase === 'Phase 2') {
                if (!sdQtyRaw) { alert("SD Count quantity is required!"); return; }
            } else if (phase === 'Phase 3') {
                if (!sdQtyRaw) { alert("SD Count quantity is required!"); return; }
            } else 
            if (phase === 'Phase 4') {

    if (!hasKits) {
        alert("At least one Kit ID is required!");
        return;
    }

    if (!condition) {
        alert("Physical Integrity (Good/Damaged) is required!");
        return;
    }

    if (!match) {
        alert("Audit Checklist Match (Yes/No) is required!");
        return;
    }

    if (!document.getElementById("input-sdupload").value) {
        alert("Apakah SD akan diupload? (Yes / No)");
        return;
    }

}

            const btnLoad = document.getElementById('btn-loading'); 
            btnLoad.classList.remove('hidden'); document.getElementById('btn-submit').disabled = true;

            

            let sdQtyParsed = sdQtyRaw ? parseInt(sdQtyRaw) : null;

            try {

                const basePayload = {

    sdr_name: phase === 'Phase 1' ? sdrNameVal : null,

    area: document.getElementById('input-area').value,

    phase: phase,

    runner_name: document.getElementById('input-runner').value,

    business_name: business,

    sd_qty: sdQtyParsed,

    sd_uploaded:

phase==="Phase 3"

?sdQtyParsed

:0,

    gps_location: document.getElementById('input-gps').value,

    device_condition: condition,

    missing_or_issue: document.getElementById('input-issue').value,

    created_at: new Date().toISOString(),

    other_item: document.getElementById('input-other-item').value,

    pickup_time: document.getElementById('input-pickup-time').value,

    drop_off_time: document.getElementById('input-dropoff-time').value

};

                let payloadsToProcess = [];

                if (selectedKits.length > 0 && (phase === 'Phase 1' || phase === 'Phase 4')) {
                    for (let i = 0; i < selectedKits.length; i++) {
                        const kId = selectedKits[i];
                        const kMaster = masterKitsData.find(k => k.kit_id === kId);
                        
                        // Menangkap Info Pairing untuk dimasukkan ke Log UI nanti via kolom 'other_item'
                        let pairStatusText = "";
                        const pairedEl = document.getElementById(`paired-device-${kId}`);
                        if (pairedEl) {
                            if (pairedEl.value === 'STANDALONE' || !pairedEl.value) {
                                pairStatusText = "STANDALONE";
                            } else {
                                pairStatusText = `Paired with ${pairedEl.value}`;
                            }
                        }

                        const file =
document.getElementById(`photo-${kId}`).files[0];

if(!file){

    alert(`Foto ${kId} belum diambil.`);
    btnLoad.classList.add('hidden');
    document.getElementById('btn-submit').disabled=false;
    return;

}

const photoBase64 =
await compressImageToBase64(file);

let sdUploaded = 0;

if (phase === "Phase 4") {

    const uploadChoice =
        document.getElementById("input-sdupload").value;

    if (!uploadChoice) {

        alert("Apakah SD akan diupload?");

        btnLoad.classList.add("hidden");
        document.getElementById("btn-submit").disabled = false;
        return;

    }

    sdUploaded = uploadChoice === "Yes" ? 1 : 0;

}
                        // Payload Utama (Misal: Mono)
let mainPayload = {

    ...basePayload,

    photo_b64: photoBase64,

    sd_uploaded: sdUploaded,

    id:'local_'+Date.now()+'_'+i,

    kit_id:kId,

    kit_type:kMaster ? kMaster.kit_type : null

};
                        // Inject informasi pairing ke dalam other_item agar bisa dipanggil saat render UI Activity Log
                        if (pairStatusText) {
                            mainPayload.other_item = basePayload.other_item ? `${basePayload.other_item} | [${pairStatusText}]` : `[${pairStatusText}]`;
                        }

                        payloadsToProcess.push(mainPayload);

                        // Payload Kedua (Misal: Wristcam yang dipasangkan otomatis)
                        if (pairedEl && pairedEl.value && pairedEl.value !== 'STANDALONE') {
                            const pairedId = pairedEl.value;
                            const pairedMaster = masterKitsData.find(k => k.kit_id === pairedId);
                            
payloadsToProcess.push({

    ...basePayload,

    photo_b64: photoBase64,

    sd_uploaded: sdUploaded,

    id:'local_pair_' + Date.now() + '_' + i,
                                kit_type: pairedMaster ? pairedMaster.kit_type : 'Paired Device',
                                missing_or_issue: (basePayload.missing_or_issue ? basePayload.missing_or_issue + " | " : "") + `[Auto-Paired with ${kId}]`
                            });
                        }
                    }
} else {

const file =
document.getElementById("general-photo").files[0];

if(!file){

    alert("Foto wajib diambil.");

    btnLoad.classList.add('hidden');

    document.getElementById('btn-submit').disabled=false;

    return;

}

const photoBase64 =
await compressImageToBase64(file);
payloadsToProcess.push({

    ...basePayload,

    photo_b64: photoBase64,

    id: 'local_' + Date.now(),

    kit_id: null,

    kit_type: null

});
                }

                for (const payload of payloadsToProcess) {
                    if (navigator.onLine) {
try {
    await processSinglePayload(payload);
}
catch (err) {

    console.error(err);

    saveToOfflineQueue(payload);

}
                    } else saveToOfflineQueue(payload);
                }
                
                showToast(navigator.onLine ? "Data Transmitted Successfully!" : "Saved Offline. Will sync automatically.", !navigator.onLine);

                this.reset(); 
                document.getElementById('input-sdr-name').value = ""; document.getElementById('input-condition').value = "";
                document.getElementById('input-match').value = ""; document.getElementById('input-sdupload').value = "";
                document.getElementById('checklist-items').innerHTML = ""; document.getElementById('input-business').value = ""; 
                document.getElementById('label-business').innerText = "Select Location..."; document.getElementById('label-business').classList.add('text-slate-400');
                document.getElementById('input-gps').value = ""; document.getElementById('gps-status').innerHTML = `<span class="font-bold text-red-600 italic uppercase">GPS Required</span>`;
                document.querySelectorAll('.btn-toggle').forEach(btn => btn.classList.remove('active'));
                
                toggleFormFields(); fetchData(); switchTab('dashboard'); 

            } catch (e) { alert("Application Error: " + e.message); } 
            finally { btnLoad.classList.add('hidden'); document.getElementById('btn-submit').disabled = false; }
        });

        async function fetchData() {
            try {
                let query = db.from('transactions').select('*').order('created_at', { ascending: false }).limit(200); 
                if(currentUser.role === 'Staff') query = query.eq('runner_name', currentUser.runner_name);
                globalTransactions = (await query).data || [];
                
                // Membaca status langsung dari master_kits agar sinkron dengan Admin
                globalKitMap.clear();
let statusStart = 0;
while (true) {
    let { data: kitStatusData } = await db.from('master_kits').select('kit_id, last_location, status_deployment').range(statusStart, statusStart + 999);
    if (!kitStatusData || kitStatusData.length === 0) break;
    
    kitStatusData.forEach(k => {
        globalKitMap.set(k.kit_id, { 
            location: k.last_location || 'Warehouse', 
            status: k.status_deployment || 'Available' 
        });
    });
    
    if (kitStatusData.length <= 999) break;
    statusStart += 1000;
}

                let offlineQueue = JSON.parse(localStorage.getItem('runner_sync_queue') || '[]');
                let offlineTrx = offlineQueue.map(q => ({...q, is_offline: true}));
                let combinedDisplay = [...offlineTrx, ...globalTransactions].slice(0, 50); 

                document.getElementById('activity-list').innerHTML = combinedDisplay.map(trx => {
                    // --- ACTIVITY LOG UI ENHANCEMENT (ACTION PLAN) ---
                    let pairingBadgeHTML = "";
                    if (trx.phase === 'Phase 1' && trx.other_item) {
                        if (trx.other_item.includes("Paired with")) {
                            let match = trx.other_item.match(/Paired with [A-Za-z0-9\-]+/);
                            if(match) pairingBadgeHTML = `<div class="text-[10px] text-blue-700 bg-blue-100 px-2 py-1 rounded-md border border-blue-200 mt-2 inline-block shadow-sm"><i class="fa-solid fa-link mr-1"></i>${match[0]}</div>`;
                        } else if (trx.other_item.includes("STANDALONE")) {
                            pairingBadgeHTML = `<div class="text-[10px] text-slate-500 bg-slate-100 px-2 py-1 rounded-md border border-slate-300 mt-2 inline-block shadow-sm"><i class="fa-solid fa-unlink mr-1"></i>STANDALONE</div>`;
                        }
                    }

                    return `
                    <li class="p-6 flex justify-between items-center hover:bg-slate-50 ${trx.is_offline ? 'bg-amber-50/50' : ''}">
                        <div class="space-y-1">
                            <p class="font-black text-slate-800 text-base">${trx.business_name} ${trx.is_offline ? '<span class="text-[9px] bg-amber-500 text-white px-2 py-0.5 rounded ml-2 shadow-sm uppercase tracking-widest"><i class="fa-solid fa-clock mr-1"></i>Pending</span>' : ''}</p>
                            <p class="text-[11px] font-bold text-slate-400 uppercase tracking-tighter">${trx.runner_name} &bull; ${trx.kit_id || trx.sd_qty+' SD'}</p>
                            ${pairingBadgeHTML}
                        </div>
                        <span class="text-[10px] font-black bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200 uppercase tracking-widest">${trx.phase}</span>
                    </li>`
                }).join('');
                
            } catch (e) { console.error("Offline: Using cache data.", e); }
        }

        window.onload = initApp;
    </script>
</body>
